<title>반도체 공정 무비</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 클린룸 모니터처럼 어두운 무대 하나 + 아래 조작 줄과 장면 목록. 의도적으로 어두운 단일 테마 */
:root{
  --bg:#0a0f15; --panel:#111a24; --line:#223040; --ink:#e7edf4; --mute:#8b9bb0;
  --cu:#e0954f; --good:#4fd18b; --bad:#ff6b5b;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:clamp(20px,3.4vw,28px);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.tracks{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tracks button{font:600 14px var(--body);color:var(--mute);background:none;border:0;padding:8px 14px;border-radius:7px;cursor:pointer}
.tracks button.on{background:var(--cu);color:#1a1006}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctrl button{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-width:44px}
.ctrl button.play{background:var(--cu);color:#1a1006;border-color:var(--cu);min-width:92px}
.bar{flex:1;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cu)}
.time{font:500 13px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
select{font:500 13px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
button:focus-visible,select:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.info{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.info{grid-template-columns:1.2fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{font-size:13px;letter-spacing:.08em;color:var(--mute);margin:0 0 8px;font-weight:600}
.card p{margin:0;line-height:1.7;font-size:15px}
.pt{color:var(--cu)}
.list{display:flex;flex-wrap:wrap;gap:6px}
.list button{font:500 12.5px var(--body);background:none;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.list button.fab{border-style:dashed}
.list button.on{color:#1a1006;background:var(--cu);border-color:var(--cu)}
.note{color:var(--mute);font-size:12.5px;margin:0}
body.rec .wrap{max-width:none;padding:0}
body.rec header,body.rec .ctrl,body.rec .info,body.rec .note{display:none}
body.rec .stage{border:0;border-radius:0}
</style>

<div class="wrap">
<header>
  <div><h1>반도체 공정 무비</h1><p class="sub">웨이퍼 한 장이 일반 반도체 패키지, 또는 HBM이 되어 AI 가속기에 들어가기까지. 트랜지스터와 하이브리드 본딩은 확대해서 따로 봅니다.</p></div>
  <div class="tracks" role="tablist" aria-label="트랙 선택"><button type="button" id="tg" class="on" role="tab">일반 반도체</button><button type="button" id="th" role="tab">HBM</button><button type="button" id="tt" role="tab">트랜지스터</button><button type="button" id="tb" role="tab">하이브리드 본딩</button></div>
</header>
<div class="stage"><svg id="sv" viewBox="0 0 960 540" role="img" aria-label="반도체 공정 애니메이션"></svg></div>
<div class="ctrl">
  <button type="button" id="prev" aria-label="이전 장면">◀</button>
  <button type="button" id="play" class="play">재생</button>
  <button type="button" id="next" aria-label="다음 장면">▶</button>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <span class="time" id="time">0:00 / 0:00</span>
  <label class="time" for="spd">속도</label>
  <select id="spd"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
</div>
<div class="info">
  <div class="card"><h2>이 장면</h2><p id="desc"></p></div>
  <div class="card"><h2>관리 포인트 · 불량</h2><p id="point" class="pt"></p></div>
</div>
<div class="card"><h2>장면 목록 (점선 = 전공정 FAB, 실선 = 후공정 TSP)</h2><div class="list" id="list"></div></div>
<p class="note">개념도 애니메이션입니다. 실제 장비 모양·치수·비율과 다르며, 공정 순서는 대표적인 흐름을 단순화했습니다.</p>
</div>

<script>
(function(){
var C={bg:'#111a24',grid:'#1b2733',ink:'#e7edf4',mute:'#8b9bb0',si:'#8ea7c0',sid:'#6f879f',ox:'#b9a6ee',pr:'#e8c25a',prx:'#f6e7b8',mask:'#2c3644',light:'#9fd8ff',pl:'#ff7a59',cu:'#e0954f',sub:'#3f8f63',subd:'#2f6e4b',emc:'#2b3038',emcs:'#5d6876',sol:'#cfd5dc',good:'#4fd18b',bad:'#ff6b5b',tape:'#7c6fb8',glass:'#a9d3e8',heat:'#ff9a3c'};
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function sg(t,a,b){return cl((t-a)/(b-a),0,1);}
function ez(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function L(a,b,t){return a+(b-a)*t;}
function R(x,y,w,h,f,ex){return '<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+Math.max(0,h)+'" fill="'+f+'" '+(ex||'')+'/>';}
function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" fill="'+(o.c||C.ink)+'" font-size="'+(o.s||14)+'" font-weight="'+(o.w||500)+'" text-anchor="'+(o.a||'start')+'" font-family="IBM Plex Sans KR, sans-serif"'+(o.op!==undefined?' opacity="'+o.op+'"':'')+'>'+s+'</text>';}
function Ln(x1,y1,x2,y2,c,w,ex){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(w||2)+'" '+(ex||'')+'/>';}
function Ci(x,y,r,f,ex){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'" '+(ex||'')+'/>';}
function rnd(i){var x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function arrow(x1,y1,x2,y2,c){var a=Math.atan2(y2-y1,x2-x1),h=9;return Ln(x1,y1,x2,y2,c,2.5)+'<path d="M'+x2+' '+y2+' L'+(x2-h*Math.cos(a-0.45))+' '+(y2-h*Math.sin(a-0.45))+' L'+(x2-h*Math.cos(a+0.45))+' '+(y2-h*Math.sin(a+0.45))+'Z" fill="'+c+'"/>';}
// 공통 단면 바탕: 실리콘 블록
var X0=170,X1=790,SY=300,SH=110;
function si(y,h){return R(X0,y||SY,X1-X0,h||SH,C.si);}
function fe(){return R(X0,SY,X1-X0,10,'#4c5f74');}

/* ===== 장면 정의: [제목, 단계(F/T), 설명, 관리포인트, draw(t)] ===== */
var S={};
S.wafer=['웨이퍼 만들기','F','고순도 실리콘을 녹여 둥근 기둥(잉곳)으로 키운 뒤 얇게 썰고 연마해 지름 300mm, 두께 약 775㎛의 웨이퍼를 만듭니다.','결정 결함, 두께·평탄도 편차. 이 두께를 나중에 후공정이 다시 갈아냅니다.',function(t){
 var a=ez(sg(t,0,.3)),b=sg(t,.3,.55),c=ez(sg(t,.5,.95)),o='';
 var iw=300*a; o+='<ellipse cx="'+(140+iw)+'" cy="270" rx="22" ry="80" fill="'+C.sid+'"/>'+R(140,190,iw,160,C.si)+'<ellipse cx="140" cy="270" rx="22" ry="80" fill="#a9bdd1"/>';
 o+=T(170,170,'실리콘 잉곳',{c:C.mute,s:14,op:a});
 if(b>0&&c<1){var sx=L(440,420,b);o+=Ln(sx,170,sx,370,C.pl,3,'opacity="'+(1-c)+'"');}
 if(c>0){var cx=L(430,700,c),rx=L(18,130,c);o+='<ellipse cx="'+cx+'" cy="270" rx="'+rx+'" ry="'+L(80,130,c)+'" fill="#b7c8da" stroke="#dce6f0" stroke-width="2"/>';
  if(c>.8){o+='<ellipse cx="'+cx+'" cy="270" rx="'+(rx*.7)+'" ry="'+(rx*.7)+'" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>';}
  o+=T(cx,430,'웨이퍼 · 300mm · 약 775㎛',{a:'middle',s:15,w:600,op:c});}
 return o;}];
S.ox=['산화','F','고온에서 산소를 흘려 실리콘 표면에 얇은 산화막(SiO₂)을 길러 냅니다. 회로를 보호하고 절연하는 막입니다.','막 두께 균일도, 계면 결함.',function(t){
 var h=2+18*ez(sg(t,.15,.9)),g=.25+.25*Math.sin(t*20),o='';
 o+=R(X0-20,140,X1-X0+40,40,C.heat,'opacity="'+g*sg(t,0,.2)+'" rx="8"')+T(480,166,'고온 산화로 · O₂',{a:'middle',c:'#1a1006',w:600,op:sg(t,0,.2)});
 o+=si()+R(X0,SY-h,X1-X0,h,C.ox)+T(X1+12,SY-h/2+5,'SiO₂',{c:C.ox,s:14,w:600})+T(X1+12,SY+60,'Si',{c:C.si,s:14,w:600});
 for(var i=0;i<14;i++){var px=X0+30+i*42,py=200+((t*260+i*37)%90);o+=Ci(px,py,3,C.light,'opacity="'+(.6*sg(t,0,.85))+'"');}
 return o;}];
S.photo=['포토 (노광)','F','감광막(PR)을 바르고, 회로 무늬가 그려진 마스크 위로 빛을 쏘아 감광막에 패턴을 찍습니다.','초점·정렬 오차, 선폭 편차. 범핑·RDL 같은 후공정도 같은 원리를 씁니다.',function(t){
 var o=si()+R(X0,SY-20,X1-X0,20,C.ox),p=sg(t,0,.25);
 o+=R(X0,SY-38,(X1-X0)*ez(p),18,C.pr)+T(X1+12,SY-24,'감광막',{c:C.pr,s:13,w:600,op:p});
 var m=ez(sg(t,.25,.45)),my=L(60,150,m);
 if(m>0){o+=R(X0,my,X1-X0,14,C.mask,'opacity="'+m+'"')+R(420,my,120,14,C.bg,'opacity="'+m+'"')+T(X0,my-8,'마스크',{c:C.mute,s:13,op:m});}
 var l=sg(t,.45,.75);
 if(l>0){for(var i=0;i<7;i++){var x=428+i*17;o+=Ln(x,90,x,L(90,SY-38,l),C.light,3,'opacity=".85"');}}
 var e=sg(t,.6,.9); o+=R(420,SY-38,120,18,C.prx,'opacity="'+e+'"');
 if(e>.5)o+=T(480,SY-46,'빛 받은 부분',{a:'middle',c:C.prx,s:13,op:e});
 return o;}];
S.etch=['식각','F','빛 받은 감광막을 현상해 없애고, 드러난 산화막을 플라즈마로 깎아 패턴을 새깁니다. 남은 감광막은 벗겨 냅니다.','식각 깊이·측벽 각도, 과식각. TSV와 플라즈마 다이싱이 같은 원리입니다.',function(t){
 var dv=sg(t,0,.2),et=ez(sg(t,.25,.7)),st=sg(t,.75,1),o=si();
 o+=R(X0,SY-20,420-X0,20,C.ox)+R(540,SY-20,X1-540,20,C.ox)+R(420,SY-20+20*et,120,20-20*et,C.ox);
 o+='<g opacity="'+(1-st)+'">'+R(X0,SY-38,420-X0,18,C.pr)+R(540,SY-38,X1-540,18,C.pr)+R(420,SY-38,120,18*(1-dv),C.prx)+'</g>';
 if(t>.22&&t<.75){for(var i=0;i<18;i++){var px=425+rnd(i)*110,py=100+((t*500+i*29)%(SY-140));o+=Ci(px,py,3.5,C.pl,'opacity=".9"');}o+=T(480,90,'플라즈마',{a:'middle',c:C.pl,s:14,w:600});}
 if(st>.5)o+=T(480,SY+140-150,'',{});
 return o;}];
S.dep=['이온주입 · 증착','F','먼저 불순물 이온을 가속해 실리콘 안에 박아 전기 특성(n형·p형)을 만들고, 그 위에 필요한 막을 고르게 쌓습니다(CVD·PVD·ALD).','이온주입: 양(도즈)과 깊이, 열처리로 손상 회복. 증착: 두께 균일도, 막 응력, 입자.',function(t){
 var o=si()+R(X0,SY-20,420-X0,20,C.ox)+R(540,SY-20,X1-540,20,C.ox),im=sg(t,0,.45),dp=ez(sg(t,.5,.95));
 if(t<.5){for(var i=0;i<6;i++){var x=432+i*20,y=L(80,SY-6,(im*3+i*.13)%1);o+=arrow(x,y-26,x,y,C.light);}o+=T(480,70,'이온 (B, P, As)',{a:'middle',c:C.light,s:14,w:600});}
 var dn=Math.floor(im*40);for(var j=0;j<dn;j++)o+=Ci(426+rnd(j+3)*108,SY+6+rnd(j+50)*34,2.6,'#ff8fb3');
 if(im>.4)o+=T(480,SY+70,'도핑 영역',{a:'middle',c:'#ff8fb3',s:13,w:600,op:im});
 if(dp>0){o+=R(X0,SY-20-12*dp,420-X0,12*dp,'#7fc7d9')+R(420,SY-12*dp,120,12*dp,'#7fc7d9')+R(540,SY-20-12*dp,X1-540,12*dp,'#7fc7d9');
  for(var k=0;k<16;k++){var px=X0+20+k*38,py=90+((t*380+k*23)%(SY-130));o+=Ci(px,py,3,'#7fc7d9','opacity="'+(1-dp)*.9+'"');}
  o+=T(X1+12,SY-26,'증착막',{c:'#7fc7d9',s:13,w:600,op:dp});}
 return o;}];
S.tsv=['TSV 형성 (HBM)','F','트랜지스터를 만든 뒤 칩에 깊은 구멍을 뚫고, 절연막·장벽막을 입힌 다음 구리로 채웁니다. 나중에 위아래 칩을 직접 잇는 기둥이 됩니다.','구리 채움 보이드, 열처리 시 구리 돌출(CTE 차이), 주변 응력 → 회로 금지 구역.',function(t){
 var o=si(SY-60,SH+60)+R(X0,SY-60,X1-X0,10,'#4c5f74'),d=ez(sg(t,0,.35)),ln=sg(t,.35,.5),cu=ez(sg(t,.55,.9)),top=SY-50,dep=140;
 var xs=[300,480,660];
 xs.forEach(function(x){o+=R(x-14,top,28,dep*d,C.bg);
  if(ln>0)o+=R(x-14,top,28,dep*d,'none','stroke="'+C.ox+'" stroke-width="'+(4*ln)+'"');
  if(cu>0)o+=R(x-11,top+dep-dep*cu,22,dep*cu,C.cu);});
 if(t<.35)o+=T(480,top-20,'깊은 구멍 식각',{a:'middle',c:C.pl,s:14,w:600});
 else if(t<.55)o+=T(480,top-20,'절연막(라이너) · 장벽막',{a:'middle',c:C.ox,s:14,w:600});
 else o+=T(480,top-20,'구리 전기도금 → CMP',{a:'middle',c:C.cu,s:14,w:600});
 return o;}];
S.beol=['금속배선 (BEOL)','F','트랜지스터 위에 구리 배선을 여러 층 쌓아 서로 연결합니다. 층마다 절연막·식각·도금·CMP를 반복합니다.','배선층의 약한 Low-k 막은 나중에 다이싱·본딩 때 박리의 원인이 됩니다.',function(t,tr){
 var o=si()+fe(),n=5;
 if(tr==='hbm'){[300,480,660].forEach(function(x){o+=R(x-11,SY+10,22,SH-10,C.cu);});}
 for(var i=0;i<n;i++){var p=sg(t,i/n,(i+.85)/n);if(p<=0)continue;var y=SY-(i+1)*26;
  o+=R(X0,y,X1-X0,26*p,'#3a4a5c');
  for(var k=0;k<6;k++){var x=X0+40+k*100+(i%2)*30;o+=R(x,y+6,60,8*p,C.cu)+R(x+26,y+14,8,12*p,C.cu);}
  if(p<1){var px=L(X0,X1-80,p);o+=R(px,y-12,80,10,'#6b7a8c','rx="3"');}}
 o+=T(X1+12,SY-60,'배선 여러 층',{c:C.cu,s:13,w:600,op:sg(t,.2,.4)});
 return o;}];
S.eds=['EDS 테스트','F','웨이퍼 상태로 칩마다 바늘(프로브)을 대고 전기 검사를 합니다. 양품·불량을 웨이퍼 맵으로 기록하고, 고칠 수 있는 칩은 수리합니다.','프로브 마크, 접촉 불량, 과검·미검. HBM은 쌓기 전 양품 칩(KGD) 확보가 핵심입니다.',function(t){
 var o='',cx=420,cy=270,r=175,s=26,cells=[];
 o+=Ci(cx,cy,r,'#2a3846');
 for(var y=cy-r;y<cy+r;y+=s)for(var x=cx-r;x<cx+r;x+=s){var mx=x+s/2-cx,my=y+s/2-cy;if(mx*mx+my*my<(r-14)*(r-14))cells.push([x,y]);}
 var nv=Math.floor(sg(t,.05,.92)*cells.length),g=0,b=0;
 cells.forEach(function(c,i){var col=C.sid;if(i<nv){var bad=rnd(i)<.1;col=bad?C.bad:C.good;bad?b++:g++;}o+=R(c[0]+2,c[1]+2,s-4,s-4,col,'rx="2" opacity="'+(i<nv?.9:.7)+'"');});
 if(nv<cells.length){var cc=cells[Math.min(nv,cells.length-1)];o+=R(cc[0]-6,cc[1]-30,s+12,22,'#d8dee6','rx="3"');for(var k=0;k<4;k++)o+=Ln(cc[0]+3+k*6,cc[1]-8,cc[0]+5+k*6,cc[1]+6,C.cu,1.5);}
 o+=T(660,200,'프로브 카드로 칩마다 검사',{c:C.mute,s:14});
 o+=Ci(672,240,8,C.good)+T(690,246,'양품 '+g,{s:15,w:600})+Ci(672,274,8,C.bad)+T(690,280,'불량 '+b,{s:15,w:600});
 o+=T(660,330,'→ 웨이퍼 맵(BIN) 저장',{c:C.mute,s:14});

S.b8=['결과: 낮고, 촘촘하고, 시원하게','T','칩 사이의 범프·필름 층이 사라져 같은 단수에서 스택이 낮아지고, 연결 간격을 수 ㎛ 이하로 줄이며, 열도 잘 빠집니다. 차세대 HBM과 zHBM(삼성 3D Cube-H)의 핵심 기술입니다.','삼성 주도 IEEE 논문에서 HBM에 적용 시 스택 높이 약 15% 감소·열 특성 개선이 보고됨(보도 기준).',function(t){

var TR={
 gen:{name:'일반 반도체',scenes:['wafer','ox','photo','etch','dep','beol','eds','bg','saw','da','wb','mold','mark','sba','sing','ftest','done']},
 tr:{name:'트랜지스터',scenes:['t1','t2','t3','t4','t5','t6','t7','t8']},
 hb:{name:'하이브리드 본딩',scenes:['b1','b2','b3','b4','b5','b6','b7','b8']},
 hbm:{name:'HBM',scenes:['wafer','ox','photo','etch','dep','tsv','beol','eds','bump','thin','debond','cow','hmold','htest','integ','next']}
};
var DUR=6000,track='gen',idx=0,tIn=0,playing=false,last=0,speed=1;
var sv=document.getElementById('sv'),desc=document.getElementById('desc'),point=document.getElementById('point'),bar=document.getElementById('bar'),time=document.getElementById('time'),list=document.getElementById('list'),playB=document.getElementById('play');
function wrap(s,n){var out=[],cur='';s.split(' ').forEach(function(w){if((cur+' '+w).trim().length>n){out.push(cur.trim());cur=w;}else cur+=' '+w;});if(cur.trim())out.push(cur.trim());return out;}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function render(){
 var tr=TR[track],key=tr.scenes[idx],sc=S[key],t=cl(tIn/DUR,0,1),phase=sc[1]==='F';
 var o='<rect width="960" height="540" fill="'+C.bg+'"/>';
 for(var gx=0;gx<960;gx+=40)o+=Ln(gx,56,gx,452,C.grid,1);
 o+=R(0,0,960,56,'#0d141c');
 o+=R(20,16,phase?118:118,26,phase?'#24364a':C.cu,'rx="13"')+T(79,34,phase?'전공정 FAB':'후공정 TSP',{a:'middle',c:phase?'#bcd3ea':'#1a1006',s:13,w:700});
 o+=T(156,35,sc[0],{s:19,w:700});
 o+=T(940,35,tr.name+' · '+(idx+1)+' / '+tr.scenes.length,{a:'end',c:C.mute,s:14});
 o+='<g>'+sc[4](t,track)+'</g>';
 o+=R(0,452,960,88,'#0d141c');
 wrap(sc[2],58).slice(0,3).forEach(function(l,i){o+=T(24,478+i*24,l,{s:15,c:'#d5dde7'});});
 o+=R(0,537,960*((idx+t)/tr.scenes.length),3,C.cu);
 sv.innerHTML=o;
 desc.textContent=sc[2];point.textContent=sc[3];
 var total=tr.scenes.length*DUR,el=idx*DUR+tIn;bar.style.width=(100*el/total)+'%';time.textContent=fmt(el)+' / '+fmt(total);
 [].forEach.call(list.children,function(b,i){b.classList.toggle('on',i===idx);});
}
function buildList(){list.innerHTML='';TR[track].scenes.forEach(function(k,i){var b=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+S[k][0];if(S[k][1]==='F')b.className='fab';b.addEventListener('click',function(){idx=i;tIn=0;render();});list.appendChild(b);});}
function setTrack(k){track=k;idx=0;tIn=0;[['tg','gen'],['th','hbm'],['tt','tr'],['tb','hb']].forEach(function(p){document.getElementById(p[0]).classList.toggle('on',k===p[1]);});buildList();render();}
function loop(ts){if(!playing)return;var dt=last?ts-last:16;last=ts;tIn+=dt*speed;if(tIn>=DUR){if(idx<TR[track].scenes.length-1){idx++;tIn=0;}else{tIn=DUR;setPlay(false);}}render();requestAnimationFrame(loop);}
function setPlay(p){playing=p;playB.textContent=p?'일시정지':'재생';if(p){last=0;if(idx===TR[track].scenes.length-1&&tIn>=DUR){idx=0;tIn=0;}requestAnimationFrame(loop);}}
playB.addEventListener('click',function(){setPlay(!playing);});
document.getElementById('prev').addEventListener('click',function(){idx=Math.max(0,idx-1);tIn=0;render();});
document.getElementById('next').addEventListener('click',function(){idx=Math.min(TR[track].scenes.length-1,idx+1);tIn=0;render();});
document.getElementById('spd').addEventListener('change',function(e){speed=parseFloat(e.target.value)||1;});
document.getElementById('tg').addEventListener('click',function(){setTrack('gen');});document.getElementById('tt').addEventListener('click',function(){setTrack('tr');});document.getElementById('tb').addEventListener('click',function(){setTrack('hb');});
document.getElementById('th').addEventListener('click',function(){setTrack('hbm');});
window.__movie={show:function(k,i,f){setPlay(false);setTrack(k);idx=i;tIn=DUR*f;render();},setTrack:setTrack,play:function(){idx=0;tIn=0;setPlay(true);},total:function(){return TR[track].scenes.length*DUR;}};
if(location.hash==='#record')document.body.classList.add('rec');
setTrack('gen');
tIn=DUR*0.6;render();tIn=0;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce&&location.hash!=='#record')setPlay(true);
})();
